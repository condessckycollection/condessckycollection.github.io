<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Condesscky Collection</title>
<meta name="theme-color" content="#0E4C8F">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Condesscky Collection">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#0E4C8F;--navy2:#0A2F5C;--or:#EE9F16;--ink:#14233A;--mut:#5A6B82;--bg:#F4F6FA;--line:#E1E6EE;--cream:#FDF1DC;--ok:#145A32;--okbg:#E3F2E8;--bad:#A32D2D;--badbg:#FDE2E2}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Montserrat,system-ui,sans-serif;font-size:15px;-webkit-tap-highlight-color:transparent}
#app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
header.top{background:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;border-bottom:3px solid var(--or);position:sticky;top:0;z-index:5}
header.top img{height:40px}
header.top h1{font-size:17px;margin:0;flex:1;font-weight:700}
.back{border:0;background:none;font-size:24px;color:var(--navy);padding:4px 8px;cursor:pointer}
main{flex:1;padding:14px 14px 96px;display:flex;flex-direction:column;gap:14px}
.card{background:#fff;border-radius:16px;padding:14px}
.card h2{font-size:14px;font-weight:700;margin:0 0 8px}
.hero{background:var(--navy);color:#fff;border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px}
.hero .big{font-weight:800;font-size:30px;color:var(--or)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{background:var(--navy2);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column}
.tile small,.mini small{font-size:11px;color:#D6E4F5}
.mini{border-radius:10px;background:var(--bg);padding:8px;display:flex;flex-direction:column;gap:2px}
.mini small{color:var(--mut)}
.mini b{font-size:13px}
.script{font-family:'Great Vibes',cursive;color:var(--or);font-size:30px;line-height:1}
.mut{color:var(--mut);font-size:12px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:50px;border-radius:14px;font:700 14px Montserrat,sans-serif;border:2px solid var(--navy);background:#fff;color:var(--navy);text-decoration:none;cursor:pointer;padding:0 14px;width:100%}
.btn.or{background:var(--or);border-color:var(--or);color:var(--ink)}
.btn.navy{background:var(--navy);color:#fff}
.btn.wa{background:#1FAF55;border-color:#1FAF55;color:#fff}
.btn.sm{min-height:38px;font-size:13px;border-radius:10px;width:auto}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.row{display:flex;align-items:center;gap:10px;min-height:52px;border-top:1px solid #EEF1F5;text-decoration:none;color:var(--ink);cursor:pointer}
.row:first-of-type{border-top:0}
.row .grow{flex:1;min-width:0;display:flex;flex-direction:column}
.row .t{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ico{width:36px;height:36px;border-radius:10px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:17px;background:var(--cream)}
.chip{font-size:11px;font-weight:700;padding:5px 9px;border-radius:10px;white-space:nowrap}
.st-nouvelle{background:var(--or);color:var(--ink)}.st-fabrication{background:#DCE8F7;color:var(--navy2)}.st-prete{background:#EDE7FB;color:#3C3489}.st-livraison{background:var(--navy);color:#fff}.st-livree{background:var(--okbg);color:var(--ok)}.st-annulee{background:#EEE;color:#666}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.chips button{flex-shrink:0;border:1px solid var(--line);background:#fff;border-radius:20px;padding:8px 12px;font:600 13px Montserrat,sans-serif;color:var(--ink);cursor:pointer}
.chips button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600}
input,select,textarea{font:500 16px Montserrat,sans-serif;padding:11px 12px;border:1px solid #CBD3DF;border-radius:10px;background:#fff;color:var(--ink);width:100%}
textarea{min-height:70px}
form{display:flex;flex-direction:column;gap:12px}
.check{flex-direction:row;align-items:center;gap:10px;font-weight:600}
.check input{width:22px;height:22px}
.line{display:flex;justify-content:space-between;gap:10px;padding:6px 0;font-size:14px}
.line.tot{font-weight:800;font-size:16px;border-top:1px solid var(--line);padding-top:10px}
nav.bot{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:6px 6px calc(10px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(5,1fr);max-width:520px;margin:0 auto;z-index:5}
nav.bot a{display:flex;flex-direction:column;align-items:center;gap:2px;min-height:48px;justify-content:center;text-decoration:none;color:var(--mut);font-size:11px;font-weight:600}
nav.bot a.on{color:var(--navy);font-weight:800}
nav.bot .plus{width:32px;height:32px;border-radius:16px;background:var(--or);color:var(--ink);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800}
.banner{padding:9px 14px;font-size:12px;font-weight:600}
.banner.off{background:var(--cream);color:#6B4A06}.banner.demo{background:#DCE8F7;color:var(--navy2)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;font-weight:600;z-index:20;max-width:90vw}
.art{border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px}
.empty{text-align:center;color:var(--mut);padding:18px 8px;font-size:14px}
.bar{height:10px;border-radius:5px;background:var(--or)}
.login{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:24px;gap:18px;background:#fff}
.login img{width:200px;align-self:center}
</style>
</head>
<body>
<div id="app"><div class="empty" style="margin-top:40vh">Chargement…</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
